name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
  DEBUG: "true"
  DB_ENGINE: sqlite
  LLM_PROVIDER: groq
  GROQ_API_KEY: gsk_ci_dummy_key_for_testing_only_1234567890
  HUGGINGFACE_API_KEY: hf_ci_dummy_token_for_testing_only
  GOOGLE_OAUTH_CLIENT_ID: ci-client-id.apps.googleusercontent.com
  GOOGLE_OAUTH_CLIENT_SECRET: ci-client-secret

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api-server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run API smoke tests
        run: python manage.py test api.tests --verbosity=2

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux native bindings
        run: npm install --no-save @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu

      - name: Build web client
        run: npm run build --workspace @agentic-ai/web-client

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
  DEBUG: "true"
  DB_ENGINE: sqlite
  LLM_PROVIDER: groq
  GROQ_API_KEY: gsk_ci_dummy_key_for_testing_only_1234567890

jobs:
  verify:
    name: Pre-deploy checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api-server/requirements.txt

      - name: Backend checks
        working-directory: apps/api-server
        run: |
          pip install -r requirements.txt
          python manage.py check
          python manage.py migrate --noinput
          python manage.py test api.tests --verbosity=2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Frontend build
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu
          npm run build --workspace @agentic-ai/web-client

  deploy-backend:
    name: Deploy API to Render
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Trigger Render API deploy
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_API_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_API_DEPLOY_HOOK_URL secret is not set — skipping API deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_API_DEPLOY_HOOK_URL"
          echo "Render API deploy triggered."

  deploy-websocket:
    name: Deploy WebSocket to Render
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Trigger Render WebSocket deploy
        env:
          RENDER_WS_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WS_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_WS_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_WS_DEPLOY_HOOK_URL secret is not set — skipping WebSocket deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_WS_DEPLOY_HOOK_URL"
          echo "Render WebSocket deploy triggered."

  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/web-client
          vercel-args: "--prod"
        continue-on-error: true

      - name: Vercel deploy skipped notice
        if: failure()
        run: |
          echo "Vercel deploy skipped or failed."
          echo "Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets to enable frontend CD."
